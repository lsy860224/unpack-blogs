name: daily-redeploy

# 예약 발행 글을 매일 공개하기 위한 재배포 트리거.
#
# 배경: 글의 공개 여부(isPublished)는 빌드 시점의 시각으로 계산되는데,
# 운영 환경에서 10분 ISR(revalidate=600) 갱신이 동작하지 않아 재배포 없이는
# 발행 시각이 지난 글이 노출되지 않는다. 발행 시각(09:00 KST) 직후에 두
# 사이트를 다시 빌드해 그날 글을 공개한다.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_HOOK_BABIPANOTE  babipanote 프로젝트의 Deploy Hook URL (브랜치: main)
#   VERCEL_HOOK_AIGRIT      aigrit 프로젝트의 Deploy Hook URL (브랜치: main)
#
# 실패하면 GitHub가 저장소 소유자에게 워크플로 실패 메일을 보낸다.

on:
  schedule:
    # 00:10 UTC = 09:10 KST. 09:00 발행 직후. GitHub 스케줄은 수 분~수십 분 지연될 수 있다.
    - cron: "10 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-redeploy
  cancel-in-progress: false

permissions: {}

jobs:
  babipanote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook (babipanote)
        env:
          HOOK_URL: ${{ secrets.VERCEL_HOOK_BABIPANOTE }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret VERCEL_HOOK_BABIPANOTE is not set"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 -X POST "$HOOK_URL"
          echo

  aigrit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook (aigrit)
        env:
          HOOK_URL: ${{ secrets.VERCEL_HOOK_AIGRIT }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret VERCEL_HOOK_AIGRIT is not set"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 -X POST "$HOOK_URL"
          echo
